name: Polymarket BTC 5m scan

on:
  schedule:
    # Every 5 minutes. GitHub may delay scheduled runs by 5-15 min under load,
    # so effective cadence will be more like every 10-15 min in practice.
    # Local Windows Task Scheduler (see polymarket-signal/scripts/install-task.ps1)
    # provides faster cadence when the host is on; cloud is the durable backup.
    - cron: "*/5 * * * *"
  workflow_dispatch: {} # allow manual trigger from the Actions tab

# Only one scan in flight at a time. If a run is queued while another is
# running, the queued one is cancelled — no duplicate commits.
concurrency:
  group: poly-scan
  cancel-in-progress: false

permissions:
  contents: write # we commit state.json + data/*.md back to the repo

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Need full history for git push
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run scan
        run: node track.mjs
        env:
          OUTPUT_MODE: file
          DATA_DIR: data/btc-5m

      - name: Run signal tick
        # Reads tracker data, settles open paper tickets, decides new ones,
        # writes signal/state.json + signal/tickets/YYYY-MM-DD.md.
        # Failures here MUST NOT block the tracker commit — paper-only.
        continue-on-error: true
        run: node signal/bin/live.mjs
        env:
          SIGNAL_DATA_DIR: data/btc-5m
          # Optional notification channels — set as repo secrets if wanted.
          # Missing secrets are no-ops inside notify.mjs (returns { skipped }).
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}

      - name: Commit changes
        run: |
          git config user.name "polymarket-tracker[bot]"
          git config user.email "polymarket-tracker[bot]@users.noreply.github.com"
          # Stage only what the scripts write
          git add state.json data/btc-5m signal/state.json signal/cache signal/tickets || true
          if git diff --cached --quiet; then
            echo "No changes — nothing to commit."
            exit 0
          fi
          STAMP=$(date -u +'%Y-%m-%d %H:%M UTC')
          git commit -m "scan: $STAMP"
          # Pull --rebase in case another (manual) commit landed.
          # Fail loudly on conflict so the next push doesn't silently lose work.
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
